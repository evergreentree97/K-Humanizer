name: Installation or repository bug
description: Report a problem with installation, skill loading, validation, documentation, or repository files.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include tokens, private text, internal URLs, full resumes, or private logs. You may write in Korean or English.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation
        - Skill loading
        - Skill behavior
        - Validation scripts
        - Documentation or links
        - Other repository files
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Share a release, tag, or commit hash if known.
      placeholder: "Example: v0.1 or ea22703"

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. Install with ...
        2. Run ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the agent, operating system, and relevant command or tool version.
      placeholder: "Cursor on macOS; Node.js 22; installed with npx skills add ..."

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Optional. Remove names, paths, tokens, private text, internal URLs, and account details before pasting.
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, private text, identifying details, internal URLs, and proprietary information.
          required: true
        - label: I agree to follow the [Code of Conduct](https://github.com/evergreentree97/K-Humanizer/blob/main/CODE_OF_CONDUCT.md).
          required: true
