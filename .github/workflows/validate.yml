name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate golden set
        run: python3 scripts/validate_golden_set.py

      - name: Run validator regression tests
        run: python3 -m unittest scripts.test_validate_golden_set scripts.test_validate_model_baseline

      - name: Validate scored model baseline
        run: python3 scripts/validate_model_baseline.py evals/reports/2026-08-25/model-baseline.jsonl

      - name: Check public hygiene
        run: python3 scripts/check_public_hygiene.py

      - name: Validate YAML files
        run: ruby -ryaml -e 'Dir[".github/**/*.yml", "skills/**/*.yaml"].sort.each { |path| YAML.load_file(path); puts "#{path} OK" }'
